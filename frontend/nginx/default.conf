server_tokens off;

gzip on;
gzip_vary on;
gzip_min_length 256;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

# The same limit as the API.
client_max_body_size 1m;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Docker DNS. A variable in proxy_pass makes nginx resolve `api` again
    # when the container restarts with a new address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Forward the API with the original path.
    location /api/ {
        # nginx checks the body size first. Return the error of the API contract.
        error_page 413 = @request_too_large;
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/security-headers.conf;
    }

    location @request_too_large {
        default_type application/json;
        include /etc/nginx/security-headers.conf;
        return 413 '{"error":{"code":"REQUEST_TOO_LARGE","message":"the request body is larger than 1 MB"}}';
    }

    # Vite puts a content hash in each file name under /assets/.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }

    # An unknown path returns index.html, so a reload on a deep link works.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }
}
